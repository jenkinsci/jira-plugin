<div>
    Jira field ID. Either a built-in field name such as <code>labels</code>, <code>duedate</code> or
    <code>description</code>, or a custom field - given either as its bare number
    (<code>10100</code>) or in full (<code>customfield_10100</code>).
    <p>
        <code>labels</code> takes a comma-separated list, for example <code>alpha, beta</code>.
    </p>
</div>
