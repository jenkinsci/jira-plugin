repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: spotless-apply
        name: Spotless Java formatter
        entry: mvn spotless:apply
        language: system
        types_or: [java]
        pass_filenames: false
