name: SonarCloud analysis (fork build)

# Untrusted build stage for fork PRs: compiles and tests the PR's code with
# NO secrets available, so there is nothing sensitive to leak even if the
# fork's code is malicious. The actual SonarCloud submission happens in a
# separate, trusted workflow (sonarcloud-fork-analysis.yml) triggered via
# workflow_run, which never executes this untrusted code.

on:
  pull_request:
    branches: [ "master" ]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build and test
        run: mvn --batch-mode -Penable-jacoco test jacoco:report

      - name: Save PR information
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-info
          echo "$HEAD_REPO" > pr-info/head-repo
          echo "$HEAD_REF" > pr-info/head-ref
          echo "$HEAD_SHA" > pr-info/head-sha
          echo "$PR_NUMBER" > pr-info/pr-number
          echo "$BASE_REF" > pr-info/base-ref

      - name: Upload PR information
        uses: actions/upload-artifact@v4
        with:
          name: pr-info-${{ github.event.pull_request.number }}
          path: pr-info/
          retention-days: 1

      - name: Upload build output for analysis
        uses: actions/upload-artifact@v4
        with:
          name: sonar-data-${{ github.event.pull_request.number }}
          path: |
            target/classes
            target/site/jacoco/jacoco.xml
          retention-days: 1
