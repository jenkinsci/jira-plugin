name: SonarCloud analysis (fork submit)

# Trusted stage for fork PR analysis. Runs in the base repo's context (so
# SONAR_TOKEN is available) after sonarcloud-fork-build.yml succeeds.
# It never runs `mvn` against the fork's pom.xml (Maven can execute arbitrary
# code from an untrusted pom via <build><extensions>, even for a read-only
# goal) - it only reads the already-built target/classes and jacoco.xml
# produced by the untrusted build job, and submits them with the
# sonar-scanner CLI action.

on:
  workflow_run:
    workflows: [ "SonarCloud analysis (fork build)" ]
    types: [ completed ]

permissions:
  actions: read
  contents: read

jobs:
  sonar:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download PR information
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const prInfo = artifacts.data.artifacts.find(a => a.name.startsWith('pr-info-'));
            if (!prInfo) {
              core.setFailed('No PR info artifact found');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: prInfo.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.mkdirSync('${{ runner.temp }}/pr-info', { recursive: true });
            fs.writeFileSync('${{ runner.temp }}/pr-info/pr-info.zip', Buffer.from(download.data));

      - name: Extract and validate PR information
        run: |
          mkdir -p "$RUNNER_TEMP/pr-info-extracted"
          unzip -q "$RUNNER_TEMP/pr-info/pr-info.zip" -d "$RUNNER_TEMP/pr-info-extracted"

          HEAD_REPO=$(cat "$RUNNER_TEMP/pr-info-extracted/head-repo")
          HEAD_REF=$(cat "$RUNNER_TEMP/pr-info-extracted/head-ref")
          HEAD_SHA=$(cat "$RUNNER_TEMP/pr-info-extracted/head-sha")
          PR_NUMBER=$(cat "$RUNNER_TEMP/pr-info-extracted/pr-number")
          BASE_REF=$(cat "$RUNNER_TEMP/pr-info-extracted/base-ref")

          # Defense in depth: these values came from a fork's build artifact,
          # so validate their shape before they're used in checkout/ref inputs.
          [[ "$HEAD_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::invalid head-repo"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid head-sha"; exit 1; }
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "::error::invalid pr-number"; exit 1; }
          [[ "$BASE_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::invalid base-ref"; exit 1; }
          # HEAD_REF (the fork's branch name) is attacker-controlled and gets
          # passed as a -Dsonar.pullrequest.branch= arg later - restrict it to
          # a safe charset instead of allowing arbitrary shell metacharacters.
          [[ "$HEAD_REF" =~ ^[A-Za-z0-9_./-]+$ ]] || { echo "::error::invalid head-ref"; exit 1; }

          echo "HEAD_REPO=$HEAD_REPO" >> "$GITHUB_ENV"
          echo "HEAD_REF=$HEAD_REF" >> "$GITHUB_ENV"
          echo "HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "BASE_REF=$BASE_REF" >> "$GITHUB_ENV"

      - name: Checkout PR head commit
        uses: actions/checkout@v7
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download build output
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const data = artifacts.data.artifacts.find(a => a.name.startsWith('sonar-data-'));
            if (!data) {
              core.setFailed('No build-output artifact found');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: data.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.mkdirSync('${{ runner.temp }}/sonar-data', { recursive: true });
            fs.writeFileSync('${{ runner.temp }}/sonar-data/sonar-data.zip', Buffer.from(download.data));

      - name: Extract build output onto checked-out sources
        run: unzip -q "$RUNNER_TEMP/sonar-data/sonar-data.zip" -d .

      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=jenkinsci
            -Dsonar.projectKey=jenkinsci_jira-plugin
            -Dsonar.sources=src/main
            -Dsonar.tests=src/test
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.pullrequest.key=${{ env.PR_NUMBER }}
            -Dsonar.pullrequest.branch=${{ env.HEAD_REF }}
            -Dsonar.pullrequest.base=${{ env.BASE_REF }}
            -Dsonar.scm.revision=${{ env.HEAD_SHA }}
            -Dsonar.qualitygate.wait=true

      - name: Delete transient artifacts
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name.startsWith('pr-info-') || artifact.name.startsWith('sonar-data-')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
